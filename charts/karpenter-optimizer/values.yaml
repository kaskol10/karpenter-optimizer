# Default values for karpenter-optimizer
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/kaskol10/karpenter-optimizer
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.47"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  # For IRSA (IAM Roles for Service Accounts) on EKS, use:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/karpenter-optimizer-role
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  # When frontend is enabled as sidecar, service targets frontend (port 80)
  # When frontend is disabled, service targets backend directly (port 8080)
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: karpenter-optimizer.local
      paths:
        - path: /
          pathType: Prefix
  # Ingress path configuration (only used when frontend is disabled)
  # When frontend is enabled, paths are automatically configured:
  #   - /api -> backend (config.port)
  #   - / -> frontend (frontend.port)
  # When frontend is disabled, use the paths defined in hosts[].paths above
  apiPath: /api
  apiPathType: Prefix
  frontendPath: /
  frontendPathType: Prefix
  tls: []
  #  - secretName: karpenter-optimizer-tls
  #    hosts:
  #      - karpenter-optimizer.local
  # Note: When frontend is enabled:
  #   - Frontend: https://your-host/ (root path)
  #   - Backend API: https://your-host/api/* (all API endpoints)
  #   - Swagger: https://your-host/api/swagger/index.html

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Configuration for Karpenter Optimizer
config:
  # Kubernetes configuration
  # Note: When running inside Kubernetes (in-cluster), leave these empty.
  # The application will automatically use in-cluster configuration.
  # Only set these if running outside the cluster (e.g., local development).
  kubeconfigPath: ""  # Path to kubeconfig file (only for out-of-cluster)
  kubeContext: ""     # Kubernetes context name (only for out-of-cluster)
  
  # Debug logging
  # Set to true to enable verbose debug logging
  debug: false
  
  # LLM Configuration (supports Ollama, LiteLLM or AWS Bedrock)
  # Set llm.provider to "ollama", "litellm" or "bedrock"
  llm:
    # Provider: "ollama", "litellm" or "bedrock" (default: "ollama" for backward compatibility)
    # "bedrock" calls the Bedrock Converse API with SigV4 auth using the AWS
    # default credential chain (e.g. IRSA on EKS) — no url/apiKey needed.
    provider: "ollama"
    # Base URL for LLM service (not used for Bedrock)
    # For Ollama: http://ollama-service:11434
    # For LiteLLM: http://litellm-service:4000
    url: ""
    # Model name
    # For Ollama: e.g., "granite4:latest", "gemma2:2b"
    # For LiteLLM: e.g., "gpt-3.5-turbo", "claude-3-sonnet"
    # For Bedrock: a model or inference profile ID, e.g. "eu.anthropic.claude-3-haiku-20240307-v1:0"
    model: ""
    # API key (optional, mainly for LiteLLM with authentication; not used for Bedrock)
    apiKey: ""
    # AWS region for Bedrock, if different from the pricing region (optional)
    awsRegion: ""
    # Response token cap for Bedrock requests, bounds the worst-case cost per
    # request (optional; unset = model default, i.e. the model's maximum)
    maxTokens: ""
    # Set to true to enable LLM features
    enabled: false
  
  # Legacy Ollama configuration (for backward compatibility)
  # If llm.provider is not set, these will be used
  ollama:
    enabled: false
    url: ""
    model: "granite4:latest"
  
  # AWS Pricing API configuration
  # Note: The AWS Pricing API uses a public endpoint and doesn't require authentication.
  # However, IRSA (IAM Roles for Service Accounts) is recommended for EKS clusters
  # to follow AWS security best practices and enable future enhancements.
  # To use IRSA, configure the serviceAccount.annotations above with your IAM role ARN.
  aws:
    region: "eu-west-1"
    # IAM role ARN for IRSA (optional, set via serviceAccount.annotations instead)
    # This is here for documentation purposes - use serviceAccount.annotations for IRSA
    # roleArn: ""
  
  # Server configuration
  port: 8080
  logLevel: "info"

  # API authentication (opt-in). When set, /api/v1 (except /health) and
  # /metrics require `Authorization: Bearer <token>`. Leave both empty for the
  # legacy open API (a startup warning is logged).
  # Preferred: reference an existing Secret containing key `api-auth-token`.
  apiAuthTokenSecret: ""
  # Dev-only: plain token (rendered into the pod spec — avoid in production).
  apiAuthToken: ""

# Alerting engine (opt-in). When enabled, the backend evaluates a set of
# conditions on each sampler tick and delivers new alerts to the configured
# channels (ntfy / Discord / Slack / generic webhook). All channels are
# SSRF-validated (public http(s) only, no redirects, resolve-then-pin).
#
# Channels are provided two ways (chart env, or the /api/v1/alerts/config API):
#   - urls: a comma-separated list of "type=url" entries (type one of
#     ntfy/discord/slack/webhook; a bare URL is treated as a webhook). URLs are
#     secrets — put them in .Values.env or a secret, not here, for prod.
#   - stateFile: where the engine persists its firing state (survives restart).
alerts:
  enabled: false
  # Example: "ntfy=https://ntfy.sh/my-topic,slack=https://hooks.slack.com/..."
  urls: ""
  # Where the engine persists its state machine. The chart mounts a writable
  # emptyDir at /tmp/alerts when alerts are enabled, so the default lives there.
  stateFile: /tmp/alerts/alerts.json

# LiteLLM gateway cost history (per-day spend/token by app/API key/team).
# When database.enabled is true the chart provisions a small CNPG
# (CloudNativePG) PostgresCluster and points the app at it, so cost history is
# durable across optimizer restarts/redeploys. When disabled (default), the app
# keeps an in-memory history that resets on restart.
#
# REQUIRES: the CNPG operator to be installed in the cluster (separately) when
# enabled. The operator creates the <cluster>-<database>-credentials secret
# that the deployment references.
database:
  enabled: false
  cluster:
    # The CNPG PostgresCluster name (also the in-cluster service DNS + the
    # base name of the credentials secret).
    name: karpenter-optimizer-history
    postgresImage:
      repository: ghcr.io/cloudnative-pg/postgresql
      tag: "16.4"
    database: karpenter_optimizer
    user: gateway_history
    # Retention for per-day cost history (hours). The app purges rows older
    # than this. 720 = 30 days.
    retentionHours: 720
    storage:
      size: 10Gi
      storageClass: ""  # e.g. gp3 / standard; empty = cluster default
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

# Durable serving history (raw per-pod serving samples, 7d window). Reuses the
# same CNPG instance as the gateway cost history when database.enabled is true;
# otherwise set SERVING_HISTORY_DSN via env. When no DSN is available the
# in-memory store serves the short windows (capped at HISTORY_WINDOW_HOURS) and
# the "7d" trend option is unavailable.
servingHistory:
  durable: false
  # Retention for raw serving samples (hours). 168 = 7 days.
  retentionHours: 168

# Environment variables
env: []
  # - name: CUSTOM_VAR
  #   value: "custom-value"

# Additional volumes
volumes: []
  # - name: config
  #   configMap:
  #     name: custom-config

# Additional volume mounts
volumeMounts: []
  # - name: config
  #   mountPath: /etc/config

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# ServiceMonitor for Prometheus (if using Prometheus Operator)
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Prometheus /metrics exporter (opt-in). When enabled, the backend serves
# cluster/NodePool/serving/gateway/disruption gauges at /metrics from the
# data it already samples (a scrape makes no extra Kubernetes calls). The
# ServiceMonitor above scrapes that path when both are enabled.
metrics:
  enabled: false

# Frontend configuration (deployed as sidecar container)
frontend:
  enabled: true
  port: 80
  image:
    repository: ghcr.io/kaskol10/karpenter-optimizer-frontend
    tag: "0.0.47"
    pullPolicy: IfNotPresent
  # API URL configuration for frontend
  # Set to empty string (default) to use relative URLs (recommended when nginx proxy is enabled)
  # Set to Kubernetes service DNS (e.g., "http://karpenter-optimizer:8080") to connect directly to backend
  # Set to external URL if needed
  apiUrl: ""
  # Enable nginx ConfigMap to proxy /api/* requests to backend service
  # When enabled, creates a ConfigMap with nginx config that proxies to the Kubernetes Service
  nginxConfig: true
  # Backend connection method: "localhost" (same pod, recommended) or "service" (via Kubernetes service DNS)
  # When using "localhost", nginx connects directly to the backend container in the same pod
  # When using "service", nginx connects via the Kubernetes service (useful for debugging or if localhost doesn't work)
  backendConnection: "localhost"
  # Nginx proxy timeout configuration.
  # nginxReadTimeout should be >= the backend request timeout (120s).
  nginxConnectTimeout: "60s"
  nginxSendTimeout: "60s"
  nginxReadTimeout: "120s"
  # Security context for frontend container (overrides pod-level securityContext)
  # Set to {} to use pod-level securityContext, or specify custom values
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

