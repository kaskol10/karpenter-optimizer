apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karpenter-optimizer.fullname" . }}
  labels:
    {{- include "karpenter-optimizer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "karpenter-optimizer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "karpenter-optimizer.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "karpenter-optimizer.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.config.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- if .Values.config.kubeconfigPath }}
            - name: KUBECONFIG
              value: {{ .Values.config.kubeconfigPath | quote }}
            {{- end }}
            {{- if .Values.config.kubeContext }}
            - name: KUBE_CONTEXT
              value: {{ .Values.config.kubeContext | quote }}
            {{- end }}
            {{- if .Values.config.debug }}
            - name: DEBUG
              value: "true"
            {{- end }}
            {{- if .Values.config.llm.enabled }}
            # LLM Provider Configuration (supports Ollama, LiteLLM or AWS Bedrock)
            - name: LLM_PROVIDER
              value: {{ .Values.config.llm.provider | default "ollama" | quote }}
            {{- if .Values.config.llm.url }}
            - name: LLM_URL
              value: {{ .Values.config.llm.url | quote }}
            {{- end }}
            {{- if .Values.config.llm.model }}
            - name: LLM_MODEL
              value: {{ .Values.config.llm.model | quote }}
            {{- end }}
            {{- if .Values.config.llm.apiKeySecret }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.llm.apiKeySecret }}
                  key: api-key
                  optional: true
            {{- else if .Values.config.llm.apiKey }}
            # Dev-only: plain API key (visible in the pod spec — prefer the
            # secret in production).
            - name: LLM_API_KEY
              value: {{ .Values.config.llm.apiKey | quote }}
            {{- end }}
            {{- if .Values.config.llm.awsRegion }}
            - name: LLM_AWS_REGION
              value: {{ .Values.config.llm.awsRegion | quote }}
            {{- end }}
            {{- if .Values.config.llm.maxTokens }}
            - name: LLM_MAX_TOKENS
              value: {{ .Values.config.llm.maxTokens | quote }}
            {{- end }}
            {{- else if .Values.config.ollama.enabled }}
            # Legacy Ollama Configuration (for backward compatibility)
            - name: OLLAMA_URL
              value: {{ .Values.config.ollama.url | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.config.ollama.model | quote }}
            {{- end }}
            - name: AWS_REGION
              value: {{ .Values.config.aws.region | quote }}
            {{- if .Values.database.enabled }}
            # Durable LiteLLM gateway cost history (CNPG). The app composes the
            # DSN from these parts; the password comes from the CNPG credentials
            # secret (<cluster>-<database>-credentials).
            - name: GATEWAY_HISTORY_DB_HOST
              value: {{ .Values.database.cluster.name }}
            - name: GATEWAY_HISTORY_DB_PORT
              value: "5432"
            - name: GATEWAY_HISTORY_DB_USER
              value: {{ .Values.database.cluster.user | quote }}
            - name: GATEWAY_HISTORY_DB_NAME
              value: {{ .Values.database.cluster.database | quote }}
            - name: GATEWAY_HISTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.cluster.name }}-{{ .Values.database.cluster.database }}-credentials
                  key: password
            - name: GATEWAY_HISTORY_RETENTION_HOURS
              value: {{ .Values.database.cluster.retentionHours | quote }}
            {{- if .Values.servingHistory.durable }}
            - name: SERVING_HISTORY_RETENTION_HOURS
              value: {{ .Values.servingHistory.retentionHours | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.alerts.enabled }}
            # Alerting engine (opt-in).
            - name: ALERTS_ENABLED
              value: "true"
            {{- if .Values.alerts.urlsSecret }}
            - name: ALERTS_URLS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.alerts.urlsSecret }}
                  key: urls
                  optional: true
            {{- else if .Values.alerts.urls }}
            # Dev-only: plain channel URLs (visible in the pod spec — prefer
            # the secret in production).
            - name: ALERTS_URLS
              value: {{ .Values.alerts.urls | quote }}
            {{- end }}
            - name: ALERTS_STATE_FILE
              value: {{ .Values.alerts.stateFile | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            # Prometheus /metrics exporter (opt-in).
            - name: METRICS_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.config.apiAuthTokenSecret }}
            # Shared bearer token for the API (protects /api/v1 and /metrics).
            # Reference an existing Secret; the key must be api-auth-token.
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.apiAuthTokenSecret }}
                  key: api-auth-token
                  optional: true
            {{- else if .Values.config.apiAuthToken }}
            # Dev-only: plain token (visible in the pod spec — prefer the
            # secret in production).
            - name: API_AUTH_TOKEN
              value: {{ .Values.config.apiAuthToken | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.alerts.enabled }}
            - name: alerts-state
              mountPath: /tmp/alerts
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.frontend.enabled }}
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- if .Values.frontend.securityContext }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          {{- end }}
          ports:
            - name: http-frontend
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
          env:
            - name: REACT_APP_API_URL
              value: {{ .Values.frontend.apiUrl | quote }}
            {{- if .Values.config.apiAuthTokenSecret }}
            # Send the shared API token as a Bearer header on every API call.
            - name: REACT_APP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.apiAuthTokenSecret }}
                  key: api-auth-token
                  optional: true
            {{- else if .Values.config.apiAuthToken }}
            - name: REACT_APP_API_TOKEN
              value: {{ .Values.config.apiAuthToken | quote }}
            {{- end }}
          volumeMounts:
            {{- if .Values.frontend.nginxConfig }}
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            {{- end }}
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-tmp
              mountPath: /var/run
            - name: frontend-config
              mountPath: /tmp/frontend-config
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
        {{- end }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.alerts.enabled }}
        - name: alerts-state
          emptyDir: {}
        {{- end }}
        {{- if and .Values.frontend.enabled .Values.frontend.nginxConfig }}
        - name: nginx-config
          configMap:
            name: {{ include "karpenter-optimizer.fullname" . }}-nginx-config
        {{- end }}
        {{- if .Values.frontend.enabled }}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
        - name: frontend-config
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

